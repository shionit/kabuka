name: Integration Tests (Yahoo Finance)

on:
  schedule:
    # 10:00 JST weekdays — TSE morning session
    - cron: '0 1 * * 1-5'
    # 09:30 ET weekdays — NYSE/NASDAQ open
    - cron: '30 14 * * 1-5'
  push:
    branches: [ main ]
    paths:
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

# Minimal default permissions; jobs declare only what they need.
permissions:
  contents: read

jobs:

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod

    - name: Run integration tests
      run: make test-integration
