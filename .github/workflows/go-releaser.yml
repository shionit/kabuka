name: GoReleaser

on:
  push:
    # Trigger only on version tags (v*) to avoid accidental release triggers.
    # Previously matched all tags (*); tightened to reduce attack surface.
    tags:
      - 'v*'

# GoReleaser must create GitHub releases, so contents: write is required here.
# All other workflows use read-only defaults.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs full git history to build the changelog.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'

      - name: Run GoReleaser
        # Upgraded from v2 → v7.2.1. goreleaser-action v6+ requires the
        # 'distribution' field; 'version: ~> v2' selects the latest GoReleaser
        # v2.x release (backward-compatible with the existing .goreleaser.yml).
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
