name: reviewdog
on: [pull_request]

# reviewdog posts review comments on PRs; pull-requests: write is required.
permissions:
  contents: read
  pull-requests: write

jobs:
  reviewdog-check:
    name: reviewdog check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: staticcheck
        uses: reviewdog/action-staticcheck@a9d23e16f283f2cbe6affeae97d9cb3e0d037c3b # v1.34.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Change reviewdog reporter if you need [github-pr-check,github-check,github-pr-review].
          reporter: github-pr-review
          # Report all results.
          filter_mode: nofilter
          fail_level: warning
          use_go_install: true

      - name: golangci-lint
        uses: reviewdog/action-golangci-lint@284129a3ac23bc5d8ac1522e0b6511df74a8836d # v2.10.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: nofilter
          fail_level: warning
          workdir: "."
          golangci_lint_flags: "--timeout=5m"
